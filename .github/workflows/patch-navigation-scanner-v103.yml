name: Patch navigation scanner v1.0.3

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-navigation-scanner-v103.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply scanner patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_navigation_scanner_v103.py
          git diff --check
          node --check Jellyfin.Plugin.QoL/Web/navigationScanner.js
          grep -F "const VERSION = '1.0.3';" Jellyfin.Plugin.QoL/Web/navigationScanner.js

      - name: Commit scanner update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-navigation-scanner-v103.yml
          git rm .github/scripts/patch_navigation_scanner_v103.py
          git add Jellyfin.Plugin.QoL/Web/navigationScanner.js
          git commit -m "feat: refine scanner candidates and home adapters"
          git push origin HEAD:dev
