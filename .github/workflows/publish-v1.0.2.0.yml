# One-shot publication workflow for v1.0.2.0. It removes itself after publishing.
name: Publish Jellyfin QoL v1.0.2.0

on:
  workflow_run:
    workflows:
      - Build plugin
    types:
      - completed

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'Main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: Main
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='1.0.2.0'
          dotnet publish ./Jellyfin.Plugin.QoL/Jellyfin.Plugin.QoL.csproj \
            -c Release \
            -o ./artifacts/publish \
            -p:Version="$VERSION" \
            -p:FileVersion="$VERSION" \
            -p:AssemblyVersion="$VERSION"

      - name: Package ZIP and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='1.0.2.0'
          ZIP="JellyfinQoL-${VERSION}.zip"
          mkdir -p ./artifacts/release
          (cd ./artifacts/publish && zip -9 "../release/$ZIP" Jellyfin.Plugin.QoL.dll)
          MD5="$(md5sum "./artifacts/release/$ZIP" | awk '{print $1}')"
          echo "$MD5  $ZIP" > "./artifacts/release/$ZIP.md5"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.0.2.0'
          ZIP='${{ steps.package.outputs.zip }}'
          TARGET_SHA='10961085e814db878c0b6011a6c37b29f0aa93b4'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "./artifacts/release/$ZIP" \
              "./artifacts/release/$ZIP.md5" \
              --clobber
          else
            gh release create "$TAG" \
              "./artifacts/release/$ZIP" \
              "./artifacts/release/$ZIP.md5" \
              --target "$TARGET_SHA" \
              --title "Jellyfin QoL $TAG" \
              --generate-notes
          fi

      - name: Update Jellyfin repository manifest
        env:
          VERSION: '1.0.2.0'
          CHECKSUM: ${{ steps.package.outputs.md5 }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('repository/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          plugin = data[0]
          version = os.environ['VERSION']
          repo = os.environ['REPOSITORY']
          release = {
              'version': version,
              'changelog': f'Release {version}. See GitHub release notes for details.',
              'targetAbi': '10.11.8.0',
              'sourceUrl': f'https://github.com/{repo}/releases/download/v{version}/JellyfinQoL-{version}.zip',
              'checksum': os.environ['CHECKSUM'],
              'timestamp': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
          }
          existing = [v for v in plugin.get('versions', []) if v.get('version') != version]
          plugin['versions'] = [release, *existing]
          plugin['owner'] = repo.split('/')[0]
          plugin['imageUrl'] = f'https://raw.githubusercontent.com/{repo}/refs/heads/Main/repository/jellyfin-qol-logo.png'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate manifest
        run: python3 ./scripts/validate-manifest.py ./repository/manifest.json

      - name: Publish manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/publish-v1.0.2.0.yml
          git add repository/manifest.json
          git commit -m 'chore: publish plugin manifest for v1.0.2.0'
          git push origin HEAD:Main

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinQoL-1.0.2.0
          path: ./artifacts/release/*
          if-no-files-found: error
          retention-days: 30
