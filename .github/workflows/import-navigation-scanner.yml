name: Import navigation scanner source

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/import-navigation-scanner.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reconstruct scanner
        shell: bash
        run: |
          set -euo pipefail
          cat Jellyfin.Plugin.QoL/Web/.navigationScanner-import/part* > /tmp/navigationScanner.js.gz.b64
          base64 -d /tmp/navigationScanner.js.gz.b64 > /tmp/navigationScanner.js.gz
          gzip -dc /tmp/navigationScanner.js.gz > Jellyfin.Plugin.QoL/Web/navigationScanner.js
          node --check Jellyfin.Plugin.QoL/Web/navigationScanner.js
          test "$(git hash-object Jellyfin.Plugin.QoL/Web/navigationScanner.js)" = "f9f15e277c3e8bc0ec82f32a31915759dffeda50"

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jellyfin.Plugin.QoL/Web/navigationScanner.js
          git commit -m "feat: import production navigation scanner source [skip ci]"
          git push origin HEAD:dev
