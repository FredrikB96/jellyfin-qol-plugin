name: Patch navigation scanner v1.0.1

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/patch-navigation-scanner-v101.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply verified scanner patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -dc > /tmp/navigationScanner-v101.patch
          git apply --check /tmp/navigationScanner-v101.patch
          git apply /tmp/navigationScanner-v101.patch
          test "$(git hash-object Jellyfin.Plugin.QoL/Web/navigationScanner.js)" = "3ccef135b0862248d606b8be7acc84697910f9f5"

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jellyfin.Plugin.QoL/Web/navigationScanner.js
          git commit -m "fix: refine scanner audit and active-page discovery"
          git push origin HEAD:dev
