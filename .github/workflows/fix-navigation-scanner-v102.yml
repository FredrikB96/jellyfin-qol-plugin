name: Fix navigation scanner v1.0.2

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/fix-navigation-scanner-v102.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply scanner patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_navigation_scanner_v102.py
          git diff --check
          grep -F "const VERSION = '1.0.2';" Jellyfin.Plugin.QoL/Web/navigationScanner.js

      - name: Commit scanner fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-navigation-scanner-v102.yml
          git rm .github/scripts/fix_navigation_scanner_v102.py
          git add Jellyfin.Plugin.QoL/Web/navigationScanner.js
          git commit -m "fix: tolerate mixed scanner collection shapes"
          git push origin HEAD:dev
